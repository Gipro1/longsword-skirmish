<!DOCTYPE html>
<html lang="en">
    <head>
        <!--
            @author: Angelo Scala 
        -->
        <meta charset="UTF-8">
        <title>Longsword Skirmish</title>

        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    
        <link href="assets/longsword.css" rel="stylesheet">
        <script src="assets/main.js" type="module"></script>
    </head>

    <body class="container-fluid d-flex flex-column vh-100 overflow-hidden">
        <header>
            <h1 class="flex-shrink-0 my-3 text-center"><img width="36px" src="https://images.steamusercontent.com/ugc/52448099175874608/178145990D752513EC66CCF3872287FAF97A077D/?imw=5000&imh=5000&ima=fit&impolicy=Letterbox&imcolor=%23000000&letterbox=false" alt="UNSC"/>Longsword Skirmish &Omega;</h1>
        </header>
        
        <main class="flex-grow-1 mx-auto d-block">
            <svg id="mySVG" viewBox="0 0 1000 500" class="w-100 h-100 mh-100 mx-auto d-block">
                <image href="assets/star_background.avif" x="0" y="0" width="1000" height="500" preserveAspectRatio="none" style="filter: brightness(0.5);" /> <!-- image by Jake Weirick -->
                <g id="splash"></g>
                <g id="endStats"></g>

                <g id="rocket" transform="translate(465,430)">
                    <polygon id="nose" points="31,5,34,-7,36,-7,39,5" fill="lightgrey"></polygon>
                    <polygon id="screen" points="33,1,34,-4,36,-4,37,1" fill="grey"></polygon>
                    <rect id="trunkLeft" x="30" y="3" width="5" height="17" fill="lightgrey" stroke="grey" stroke-width="0.7"></rect>
                    <rect id="trunkRight" x="35" y="3" width="5" height="17" fill="lightgrey" stroke="grey" stroke-width="0.7"></rect>
                    <polygon id="mid" points="30,20,40,20,37,35,33,35" fill="darkgrey" stroke="grey"></polygon>
                    <rect id="leftCannon" x="20" y="4" width="3" height="10" fill="grey"></rect>
                    <polygon id="leftWing" points="30,2,27,2,0,20,0,25,30,35" fill="lightgrey"></polygon>
                    <rect id="leftEngine" x="17" y="18" width="8" height="20" fill="lightgrey" stroke="grey"></rect>            
                    <polygon id="flameLeft" fill="orange" points="19,38,21,45,23,38"></polygon>
                    <rect id="rightCannon" x="47" y="4" width="3" height="10" fill="grey"></rect>
                    <polygon id="rightWing" points="40,2,43,2,70,20,70,25,40,35" fill="lightgrey"></polygon>
                    <rect id="rightEngine" x="45" y="18" width="8" height="20" fill="lightgrey" stroke="grey"></rect>
                    <polygon id="flameRight" fill="orange" points="47,38,49,45,51,38"></polygon>
                    <polygon id="tail" points="34,35,36,35,36,55,35,65,34,55" fill="lightgrey"></polygon>
                </g>

                <g id="banshee" transform="translate(470,-200)">
                    <rect id="middleBack" x="21" y="0" width="13" height="35" ry="30" fill="indigo"></rect>
                    <rect id="middleFront" x="20" y="15" width="15" height="25" ry="10" fill="indigo"></rect>
                    <polyline id="leftTrail" points="0,15,0,-50" stroke-width="1" stroke="lightblue"></polyline>
                    <polyline id="leftJet" points="23,10,0,15,0,13,0,19,0,17,21,28" fill="none" stroke-width="2" stroke="indigo"></polyline>
                    <polyline id="rightTrail" points="55,15,55,-50" fill="white" stroke-width="1" stroke="lightblue"></polyline>
                    <polyline id="rightJet" points="32,10,55,15,55,13,55,19,55,17,34,28" fill="none" stroke-width="2" stroke="indigo"></polyline>
                </g>

                <g id="phantom" transform="translate(470,-200)">                
                    <rect id="body_horizontal_rear" x="18" y="16" width="22" height="30" rx="15" ry="40" fill="#392A48" stroke="purple"></rect>
                    <rect id="body_horizontal_front" x="9" y="38" width="40" height="30" rx="15" ry="40" fill="indigo" stroke="purple"></rect>
                    <polygon id="left_spike" points="18,10,18,27,21,25" fill="#34132E" stroke="#702963"></polygon>
                    <polygon id="right_spike" points="40,10,40,27,37,25" fill="#34132E" stroke="#702963"></polygon>
                    <polygon id="mid_spike" points="29,5,25,23,33,23" fill="#34132E" stroke="#702963"></polygon>
                    <rect id="body_left_rear" x="9" y="24" width="23" height="34" rx="15" ry="30" fill="#34132E" stroke="#702963"></rect>
                    <rect id="body_right_rear" x="26" y="24" width="23" height="34" rx="15" ry="30" fill="#34132E" stroke="#702963"></rect>
                    <rect id="body_left" x="5" y="32" width="26" height="34" rx="15" ry="30" fill="#34132E" stroke="#702963"></rect>
                    <rect id="body_right" x="27" y="32" width="26" height="34" rx="15" ry="30" fill="#34132E" stroke="#702963"></rect>
                    <rect id="body_horizontal_cover" x="9" y="25" width="40" height="30" rx="15" ry="40" fill="#34132E"></rect>
                    <rect id="body_vertical" x="19" y="19" width="20" height="58" rx="10" ry="26" fill="#34132E" stroke="#702963"></rect>
                </g>
                
                <g id="btn" transform="translate(420,220)" style="cursor: pointer">
                    <rect x="0" y="0" width="160" height="60" rx="10" fill="lightblue"></rect>
                    <text id="start" x="40" y="42" font="arial" font-size="30" fill="black">START</text>
                </g>
            </svg>
        </main>

        <footer class="mt-auto py-3">
            <hr class="text-white m-0">
            <p class="text-white text-center m-0 pt-2">Angelo Scala &copy; 2026</p>
        </footer>
    </body>
</html>
